# LaniakeA Protocol - Render Deployment Configuration
# Optimized for Render Free Tier
# Version: 3.1.0

services:
  # Main Web Service
  - type: web
    name: laniakea-protocol
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    # Explicitly enable auto-deploy on push to main. Observed in late-July
    # 2026 that Render was not picking up pushes even though the service
    # was created from this repo; setting the flag explicitly fixes it
    # if the dashboard default is "off".
    autoDeploy: true
    autoDeployTrigger: commit
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head
    startCommand: python main.py start --node-id laniakea-render --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # Python Configuration
      - key: PYTHON_VERSION
        value: "3.11"

      - key: PYTHONUNBUFFERED
        value: "1"

      # Ensure project root is on PYTHONPATH (Render defaults vary).
      - key: PYTHONPATH
        value: ".:laniakea"

      # Node Configuration
      - key: NODE_ID
        value: laniakea-render-node

      - key: ENVIRONMENT
        value: production

      # Security
      - key: JWT_SECRET
        generateValue: true

      - key: ENCRYPTION_KEY
        generateValue: true

      # Logging
      - key: LOG_LEVEL
        value: INFO

      # AI Configuration
      - key: AI_ENABLED
        value: "true"

      # Performance
      - key: AUTO_OPTIMIZE
        value: "true"

      # Schema management: Alembic owns the schema in production
      - key: LANIAKEA_RUN_MIGRATIONS
        value: "1"
