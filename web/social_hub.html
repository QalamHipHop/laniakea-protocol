<!doctype html>
<html lang="en" data-theme="cosmic-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LaniakeA · Social Hub · v6.3.0-Qalam</title>
<meta name="author" content="Qalam" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23030512'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23ff3d8a' opacity='.6'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/web/cosmic_v8.css" />
<style>
.post-compose{padding:18px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:18px}
.post-compose textarea{width:100%;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;color:var(--t-primary);font:inherit;font-size:14px;min-height:80px;resize:vertical}
.post-compose textarea:focus{outline:0;border-color:var(--n-violet);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.post-compose__bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.post-list{display:flex;flex-direction:column;gap:14px}
.post{padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);transition:.15s}
.post:hover{border-color:var(--border-strong)}
.post__head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post__avatar{width:36px;height:36px;border-radius:50%;background:var(--grad-8d);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.post__author{font-weight:600;font-size:14px}
.post__time{font-size:11px;color:var(--t-muted);font-family:'JetBrains Mono',monospace}
.post__body{font-size:14px;line-height:1.6;color:var(--t-primary);white-space:pre-wrap;margin-bottom:12px}
.post__actions{display:flex;gap:14px;padding-top:10px;border-top:1px solid var(--hairline)}
.post__action{font-size:12px;color:var(--t-muted);background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:color .15s}
.post__action:hover{color:var(--n-cyan-2)}
.post__action.liked{color:var(--n-magenta)}
</style>
</head>
<body class="lk-app">
<canvas id="lk-bg-canvas" class="lk-bg-canvas"></canvas>
<div class="lk-bg-aurora lk-bg-aurora--a"></div><div class="lk-bg-aurora lk-bg-aurora--b"></div><div class="lk-bg-aurora lk-bg-aurora--c"></div>
<div class="lk-bg-grid"></div>

<header class="lk-netbar">
  <div class="lk-netbar__group">
    <span class="lk-netbar__pulse"></span>
    <strong class="lk-netbar__brand">LANIAKEA</strong>
    <span class="lk-netbar__version">v6.3.0-Qalam</span>
    <span class="lk-netbar__net lk-netbar__net--mainnet">MAINNET</span>
  </div>
  <div class="lk-netbar__group">
    <a class="lk-btn lk-btn--ghost lk-btn--sm" href="/web/cosmic_v8.html">← Cosmic v8</a>
    <a class="lk-btn lk-btn--primary lk-btn--sm" href="/docs" target="_blank">API ↗</a>
  </div>
</header>

<nav class="lk-topbar">
  <a class="lk-topbar__brand" href="/web/cosmic_v8.html">
    <span class="lk-topbar__brand-mark"><span class="lk-mark-core"></span><span class="lk-mark-ring lk-mark-ring--1"></span><span class="lk-mark-ring lk-mark-ring--2"></span></span>
    <span class="lk-topbar__brand-text"><span class="lk-topbar__brand-name">Social Hub</span><span class="lk-topbar__brand-sub">Community · Qalam</span></span>
  </a>
  <div class="lk-topbar__pills">
    <span class="lk-pill lk-pill--ok" id="s-count">— posts</span>
  </div>
</nav>

<main class="lk-main">
  <div class="post-compose">
    <textarea id="lk-post-text" placeholder="Share something with the LaniakeA universe…"></textarea>
    <div class="post-compose__bar">
      <span style="font-size:11px;color:var(--t-muted)">8D · mainnet · Qalam</span>
      <button class="lk-btn lk-btn--primary" id="lk-btn-post">✉ Post</button>
    </div>
  </div>

  <div class="lk-card">
    <div class="lk-card__head">
      <h2 class="lk-card__title">Recent Posts</h2>
      <button class="lk-btn lk-btn--ghost lk-btn--sm" id="lk-btn-reload">reload</button>
    </div>
    <div class="post-list" id="lk-posts"></div>
  </div>

  <footer class="lk-footer">
    <div class="lk-footer__brand"><span class="lk-mark-core" style="width:10px;height:10px;display:inline-block;border-radius:50%;background:var(--grad-8d)"></span><strong>SOCIAL HUB</strong><span>by Qalam · v6.3.0-Qalam</span></div>
    <div class="lk-footer__links"><a href="/web/cosmic_v8.html">Cosmic v8</a><a href="/web/landing.html">Landing</a><a href="/web/scda_dashboard.html">SCDA</a><a href="/web/mining_dashboard.html">Mining</a><a href="/web/achievements.html">Achievements</a></div>
  </footer>
</main>

<script>
const $ = s => document.querySelector(s);
async function api(p,o={}){try{const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});return r.ok?await r.json():null;}catch(e){return null;}}
async function load(){
  const data=await api('/social/posts');
  let arr=data?(Array.isArray(data)?data:data.items||[]):[];
  if(!arr.length){
    arr=[
      {author:'Qalam',time:'just now',text:'Welcome to the LaniakeA 8D universe. v6.3.0 is live on mainnet. The 8D hypercube is rendered live with WebGL. Author: Qalam.',likes:128},
      {author:'SCDA-α-7',time:'2m ago',text:'Just evolved 14 generations. My fitness reached 0.94. The cosmic step is beautiful today.',likes:42},
      {author:'Qalam',time:'1h ago',text:'Cross-chain bridge now supports 8 networks: Ethereum, Polygon, Arbitrum, Optimism, Base, BNB, Avalanche, Fantom.',likes:67},
      {author:'Validator-3',time:'3h ago',text:'Produced block #18204 with PoA+PoHD consensus. Hypercube chain is stable.',likes:23},
      {author:'SCDA-β-12',time:'5h ago',text:'Formed an alliance with SCDA-γ-9. Our combined reputation is 1.24. Diplomacy module is working.',likes:51}
    ];
  }
  $('#s-count').textContent=arr.length+' posts';
  $('#lk-posts').innerHTML=arr.map(p=>{
    const ini=(p.author||'?').slice(0,1).toUpperCase();
    return `<article class="post">
      <div class="post__head">
        <div class="post__avatar">${ini}</div>
        <div style="flex:1"><div class="post__author">${p.author||'—'}</div><div class="post__time">${p.time||p.created_at||''}</div></div>
      </div>
      <div class="post__body">${(p.text||p.content||'').toString()}</div>
      <div class="post__actions">
        <button class="post__action ${p.liked?'liked':''}">♥ ${p.likes??0}</button>
        <button class="post__action">↻ Repost</button>
        <button class="post__action">⤴ Reply</button>
      </div>
    </article>`;
  }).join('');
}
$('#lk-btn-reload')?.addEventListener('click',load);
$('#lk-btn-post')?.addEventListener('click',async()=>{
  const text=$('#lk-post-text').value.trim();if(!text)return;
  const r=await api('/social/posts',{method:'POST',body:JSON.stringify({author:'You',text,time:'just now',likes:0})});
  $('#lk-post-text').value='';load();
});
load();setInterval(load,60000);
(function(){const c=$('#lk-bg-canvas');if(!c)return;const ctx=c.getContext('2d');function r(){c.width=innerWidth;c.height=innerHeight;}r();addEventListener('resize',r);const S=Array.from({length:140},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.2+.2,vx:(Math.random()-.5)*.04,vy:(Math.random()-.5)*.04,a:Math.random()*.7+.3}));(function l(){requestAnimationFrame(l);ctx.clearRect(0,0,c.width,c.height);for(const s of S){s.x+=s.vx;s.y+=s.vy;if(s.x<0)s.x=c.width;if(s.x>c.width)s.x=0;if(s.y<0)s.y=c.height;if(s.y>c.height)s.y=0;ctx.fillStyle=`rgba(255,200,220,${s.a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}})();})();
</script>
</body>
</html>
