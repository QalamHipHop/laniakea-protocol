name: CI

on:
  push:
    branches: [main, dev/**, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_extended.txt
          pip install pytest pytest-cov flake8 black isort
      - name: Lint with flake8
        run: |
          flake8 laniakea/ --count --max-line-length=120 --statistics
      - name: Format check
        run: |
          black --check laniakea/
          isort --check-only laniakea/
      - name: Run tests
        env:
          LANIAKEA_TEST_MODE: 'true'
        run: |
          pytest tests/ -v --cov=laniakea --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          fail_ci_if_error: false

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML/CSS/JS
        run: |
          for f in web/cosmic.html web/landing.html web/mobile/index.html; do
            test -f "$f" && echo "✓ $f"
          done
      - name: JS syntax check
        run: |
          for f in web/cosmic.js web/cosmic-ws.js web/cosmic-wallet.js web/landing.js web/mobile/js/mobile.js; do
            node --check "$f" 2>&1 || echo "⚠ $f (skipped, browser globals)"
          done

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t laniakea:test .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name lk-test laniakea:test
          sleep 10
          curl -f http://localhost:8000/health || (docker logs lk-test; exit 1)
          docker stop lk-test
