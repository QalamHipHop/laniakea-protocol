# Alembic configuration for LaniakeA Protocol
# This file is the entry-point for Alembic migrations.
# Run: `alembic upgrade head` to apply migrations.

[alembic]
# Migration scripts directory
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Set in alembic/env.py from environment / .env
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Tag rows in alembic_version
# revision_environment = false

[post_write_hooks]
# (Optional) formatters/black hooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
